name: News reel (12 a day — every 2 hours, AI ↔ Tech & Business)

# Every 2 hours: one reel. Windows alternate AI and Tech & Business (6 + 6 a day). Each run checks Google Trends across
# 30 countries + news feeds for its topic, lets Claude pick the best story (or a roundup), makes the reel and posts it via Buffer.
# A backup run 1 hour later only works if the window's reel wasn't posted (it exits in seconds otherwise).
on:
  schedule:
    - cron: "41 1-23/2 * * *"   # main runs:   01:11, 03:11, 05:11 … 23:11 IST
    - cron: "41 0-22/2 * * *"   # backup runs: 02:11, 04:11, 06:11 … 00:11 IST
  push:
    paths: ["triggers/run-now.txt"]  # edit this file on GitHub to start a run immediately
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Render only, don't post"
        type: boolean
        default: true
      topic:
        description: "Force a topic: ai or tech (blank = by time slot)"
        required: false
        default: ""
      style:
        description: "Render style: blank = repo default, remotion = editorial motion graphics, modern = glass look"
        required: false
        default: ""
      guard:
        description: "1 = skip if this 2-hour window already posted (used by the Scheduler)"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: news-reels
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Already posted in this window?
        id: slot
        if: github.event_name == 'schedule' || inputs.guard == '1'
        run: |
          python3 - <<'PY'
          import datetime as dt, json, os
          ist = dt.datetime.now(dt.timezone(dt.timedelta(hours=5, minutes=30))) - dt.timedelta(hours=1)
          key = f"{ist:%Y-%m-%d}-{ist.hour // int(os.environ.get('SLOT_HOURS') or 2):02d}"
          try: done = json.load(open("logs/slots.json")).get(key, {}).get("status") == "posted"
          except Exception: done = False
          print(f"window {key}: {'already posted' if done else 'needs a reel'}")
          open(os.environ["GITHUB_OUTPUT"], "a").write(f"skip={'true' if done else 'false'}\n")
          PY
        env:
          SLOT_HOURS: ${{ vars.SLOT_HOURS }}
      - uses: actions/setup-python@v5
        if: steps.slot.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip
      - name: System packages
        if: steps.slot.outputs.skip != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libraqm0 libfribidi0 libcairo2 fontconfig \
            libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 \
            libatk-bridge2.0-0 libpango-1.0-0 libcups2 || true
          sudo apt-get install -y -qq libasound2t64 || sudo apt-get install -y -qq libasound2 || true
          mkdir -p ~/.local/share/fonts && cp pipeline/render/fonts/*.ttf ~/.local/share/fonts/ && fc-cache -f
      - name: Python packages
        if: steps.slot.outputs.skip != 'true'
        run: |
          pip install -q -r requirements.txt
          python -c "from PIL import features; assert features.check('raqm'), 'text shaping (raqm) missing'"
      - uses: actions/setup-node@v4
        if: steps.slot.outputs.skip != 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: remotion/package-lock.json
      - name: Remotion (motion graphics renderer)
        if: steps.slot.outputs.skip != 'true'
        run: |
          cd remotion && npm ci --no-audit --no-fund && npx remotion browser ensure
      - name: Check the news, make & post a reel
        if: steps.slot.outputs.skip != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ vars.BUFFER_CHANNEL_ID }}
          BUFFER_ORG_ID: ${{ vars.BUFFER_ORG_ID }}
          BUFFER_MODE: ${{ vars.BUFFER_MODE }}
          POSTING_MODE: ${{ vars.POSTING_MODE }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          MEDIA_REPO: ${{ vars.MEDIA_REPO }}
          MEDIA_TOKEN: ${{ secrets.MEDIA_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IG_HANDLE: ${{ vars.IG_HANDLE }}
          SELECT_MODEL: ${{ vars.SELECT_MODEL }}
          SCRIPT_MODEL: ${{ vars.SCRIPT_MODEL }}
          EDIT_MODEL: ${{ vars.EDIT_MODEL }}
          SINGLE_MIN_IMPORTANCE: ${{ vars.SINGLE_MIN_IMPORTANCE }}
          ROUNDUP_MIN_IMPORTANCE: ${{ vars.ROUNDUP_MIN_IMPORTANCE }}
          LOOKBACK_HOURS: ${{ vars.LOOKBACK_HOURS }}
          TREND_GEOS: ${{ vars.TREND_GEOS }}
          VOICE_PROVIDER: ${{ vars.VOICE_PROVIDER }}
          EDGE_VOICE: ${{ vars.EDGE_VOICE }}
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
          MASCOT_BADGE: ${{ vars.MASCOT_BADGE }}
          RENDER_STYLE: ${{ inputs.style || vars.RENDER_STYLE }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || vars.DRY_RUN }}
          SLOT_GUARD: ${{ (github.event_name == 'schedule' || inputs.guard == '1') && '1' || '0' }}
          MUST_POST: ${{ vars.MUST_POST }}
          SLOT_HOURS: ${{ vars.SLOT_HOURS }}
          TOPIC_ROTATION: ${{ vars.TOPIC_ROTATION }}
          TOPIC: ${{ inputs.topic }}
        run: python -m pipeline.run
      - name: Keep the reel (7 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reel-${{ github.run_number }}
          path: out/*.mp4
          if-no-files-found: ignore
          retention-days: 7
      - name: Save logs
        if: always()
        run: |
          git config user.name "ainews-bot"
          git config user.email "bot@users.noreply.github.com"
          git add logs
          git diff --cached --quiet || git commit -m "news run ${{ github.run_number }}"
          git pull --rebase -q && git push -q || echo "nothing to push"
