name: Scheduler (keeps the posting clock)

# GitHub's own cron is "best effort" and silently drops many runs on young repos. This job is the real clock:
# it stays awake for ~5h40m, checks every minute which posting window we're in (POST_TIMES, IST; default 13:00 and 20:00),
# and starts "Tutorial reel" for any window that hasn't posted yet (retrying every 50 minutes inside the window if a run failed). Before it ends it starts the
# next Scheduler, so the clock never stops. The hourly cron below is only a backstop that restarts it if needed.
# Free: public repos have unlimited Actions minutes.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  actions: write
  contents: read

concurrency:
  group: scheduler
  cancel-in-progress: false

jobs:
  clock:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Keep the clock
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          POST_TIMES: ${{ vars.POST_TIMES }}
          START_AFTER_MIN: ${{ vars.START_AFTER_MIN }}
        run: |
          python3 - <<'PY'
          import base64, datetime as dt, json, os, subprocess, time
          REPO = os.environ["REPO"]
          TIMES = sorted(t.strip() for t in (os.environ.get("POST_TIMES") or "13:00,20:00").split(",") if t.strip())
          AFTER = int(os.environ.get("START_AFTER_MIN") or 0)        # minutes after the window opens (the run takes ~10 min)
          WORKFLOW = "tutorial-reel.yml"
          IST = dt.timezone(dt.timedelta(hours=5, minutes=30))
          RUN_FOR = 5 * 3600 + 40 * 60
          t_start = time.time()

          def gh(*args):
              r = subprocess.run(["gh", *args], capture_output=True, text=True)
              if r.returncode: print("  gh error:", r.stderr.strip()[:200], flush=True)
              return r.stdout

          def window(now):
              starts = [dt.datetime(d.year, d.month, d.day, *map(int, t.split(":")), tzinfo=IST)
                        for d in (now.date() - dt.timedelta(days=1), now.date()) for t in TIMES]
              start = max(x for x in starts if x <= now)
              return f"{start:%Y-%m-%d-%H%M}", start

          def posted(key):
              out = gh("api", f"repos/{REPO}/contents/logs/tutorial_slots.json", "--jq", ".content")
              try: return json.loads(base64.b64decode(out)).get(key, {}).get("status") == "posted"
              except Exception: return False

          def reel_running():
              for st in ("in_progress", "queued"):
                  out = gh("run", "list", "-R", REPO, "--workflow", WORKFLOW, "--status", st, "--json", "databaseId")
                  try:
                      if json.loads(out or "[]"): return True
                  except Exception: pass
              return False

          last = {}
          print(f"clock started {dt.datetime.now(IST):%Y-%m-%d %H:%M} IST — reels at {', '.join(TIMES)} IST", flush=True)
          while time.time() - t_start < RUN_FOR:
              now = dt.datetime.now(IST)
              key, start = window(now)
              if now >= start + dt.timedelta(minutes=AFTER) and time.time() - last.get(key, 0) > 50 * 60:
                  if posted(key):
                      last[key] = time.time() + 10 ** 9           # done for this window
                  elif reel_running():
                      pass
                  else:
                      print(f"{now:%H:%M} IST: window {key} has no reel yet -> starting {WORKFLOW}", flush=True)
                      gh("workflow", "run", WORKFLOW, "-R", REPO, "-f", "dry_run=false", "-f", "guard=1")
                      last[key] = time.time()
              time.sleep(60)
          print("handing over to the next clock", flush=True)
          gh("workflow", "run", "scheduler.yml", "-R", REPO)
          PY
